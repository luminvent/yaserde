[package]
name = "yaserde_derive"
version = "0.12.0"
authors = ["Marc-Antoine Arnaud <arnaud.marcantoine@gmail.com>"]
description = "Serialization and deserialization macros"
keywords = ["Serialization", "Deserialization"]
license = "MIT"
repository = "https://github.com/luminvent/yaserde"
homepage = "https://github.com/luminvent/yaserde"
documentation = "https://docs.rs/yaserde"
readme = "../README.md"
edition.workspace = true
rust-version.workspace = true

[dependencies]
heck = "0.5"
serde = { version = "1", features = ["derive"] }
serde_tokenstream = "0.2"
syn = { version = "3", features = ["parsing", "visit", "extra-traits"] }
proc-macro2 = "1"
quote = "~1.0"
log = "0.4"

[lib]
proc-macro = true
